<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cinder Drift</title>
<style>
  html, body { margin: 0; height: 100%; background: #07060f; overflow: hidden; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = Math.min(W, H) / 640;
  if (Math.max(W, H) / Math.min(W, H) > 1.2) S = Math.min(W, H) / 620;
}
window.addEventListener('resize', resize);
resize();

// ---------- tuning ----------
const ORBIT_V = 240, FLY_V = 470, MAX_FLY = 640, DECAY = 11;
const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

// ---------- audio ----------
let AC = null, master = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, slideTo) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol || 0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
const PENT = [0, 2, 4, 7, 9];
function note(i) { return 261.63 * Math.pow(2, (PENT[i % 5] + 12 * Math.floor(i / 5)) / 12); }
function sndLaunch() { tone(300, 0.18, 'triangle', 0.25, 900); }
function sndCapture(streak) { const n = Math.min(streak, 12); tone(note(n), 0.35, 'sine', 0.35); tone(note(n) * 2, 0.25, 'triangle', 0.12); }
function sndDie() { tone(180, 0.7, 'sawtooth', 0.3, 40); tone(90, 0.8, 'square', 0.15, 30); }
function sndTick() { tone(880, 0.05, 'square', 0.06); }

// ---------- state ----------
let planets, hazards, player, cam, state, score, best, streak, fwd, particles, popups, trail, stars, shake, t, deadT, lastNoteT, newBest;
try { best = parseInt(localStorage.getItem('cinderdrift_best') || '0', 10) || 0; } catch (e) { best = 0; }

function makeStars() {
  stars = [];
  for (let i = 0; i < 140; i++) stars.push({ x: Math.random(), y: Math.random(), z: rnd(0.1, 0.6), r: rnd(0.6, 1.6), p: rnd(0, TAU) });
}
makeStars();

function makePlanet(x, y, idx) {
  const diff = Math.min(idx / 40, 1);
  const capR = rnd(72, 100) - diff * 24;
  return { x, y, idx, core: rnd(13, 20), capR, hue: Math.floor(rnd(0, 360)), pulse: rnd(0, TAU), claimed: false };
}

function spawnNext() {
  const last = planets[planets.length - 1];
  const idx = last.idx + 1;
  const diff = Math.min(idx / 40, 1);
  const ang = rnd(-0.85, 0.85);
  const base = Math.atan2(fwd.y, fwd.x) + ang;
  const dist = rnd(250, 320) + diff * 90;
  const p = makePlanet(last.x + Math.cos(base) * dist, last.y + Math.sin(base) * dist, idx);
  planets.push(p);
  if (idx >= 6 && Math.random() < Math.min(0.25 + diff * 0.45, 0.65)) {
    const mx = (last.x + p.x) / 2, my = (last.y + p.y) / 2;
    const dx = p.x - last.x, dy = p.y - last.y, l = Math.hypot(dx, dy);
    const side = Math.random() < 0.5 ? -1 : 1, off = rnd(40, 80) * side;
    hazards.push({ x: mx - dy / l * off, y: my + dx / l * off, r: rnd(24, 32), ph: rnd(0, TAU) });
  }
}

function reset(startReady) {
  const portrait = H > W;
  fwd = portrait ? { x: 0, y: -1 } : { x: 1, y: 0 };
  planets = []; hazards = []; particles = []; popups = []; trail = [];
  const p0 = makePlanet(0, 0, 0); p0.capR = 96; p0.core = 18; p0.hue = 28; p0.claimed = true;
  planets.push(p0);
  for (let i = 0; i < 6; i++) spawnNext();
  player = { x: 96, y: 0, a: 0, d: 1, r: 96, cur: p0, mode: 'orbit', vx: 0, vy: 0, fly: 0, ignore: null, lap: 0, orbT: 0, lastA: 0 };
  cam = { x: 0, y: 0 };
  cam.x = p0.x - fwd.x * 100; cam.y = p0.y - fwd.y * 100;
  score = 0; streak = 0; shake = 0; t = 0; deadT = 0; newBest = false; lastNoteT = 0;
  state = startReady ? 'ready' : 'play';
}
reset(true);

function setBest() {
  if (score > best) { best = score; newBest = true; try { localStorage.setItem('cinderdrift_best', String(best)); } catch (e) {} }
}

function burst(x, y, n, hue, spd, life) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(0.2, 1) * spd;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.5, 1) * (life || 0.8), max: life || 0.8, hue, size: rnd(1.5, 3.5) });
  }
}
function popup(x, y, text, hue) { popups.push({ x, y, text, hue, life: 1 }); }

// ---------- input ----------
function press() {
  initAudio();
  if (state === 'dead') { if (deadT > 0.55) reset(false); return; }
  if (state === 'ready') state = 'play';
  if (player.mode === 'orbit') launch();
}
function launch() {
  const p = player;
  const tx = -Math.sin(p.a) * p.d, ty = Math.cos(p.a) * p.d;
  p.vx = tx * FLY_V; p.vy = ty * FLY_V; p.mode = 'fly'; p.fly = 0; p.ignore = p.cur;
  sndLaunch();
  burst(p.x, p.y, 10, 190, 120, 0.4);
  shake = Math.max(shake, 2);
}
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); if (!e.repeat) press(); }
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
window.addEventListener('contextmenu', e => e.preventDefault());

function die(why) {
  if (state === 'dead') return;
  state = 'dead'; deadT = 0; streak = 0;
  setBest();
  sndDie();
  burst(player.x, player.y, 46, 12, 320, 1.1);
  burst(player.x, player.y, 20, 45, 200, 1.2);
  shake = 16;
  player.mode = 'dead'; player.why = why;
}

// ---------- update ----------
function playerPos() { return player; }

function update(dt) {
  t += dt;
  const p = player;
  if (state === 'dead') deadT += dt;

  if (state === 'play' || state === 'ready') {
    if (p.mode === 'orbit') {
      const c = p.cur;
      if (state === 'play') {
        p.r -= DECAY * (1 + Math.min(score, 30) * 0.03) * dt;
        if (p.r <= c.core + 4) { p.x = c.x + Math.cos(p.a) * p.r; p.y = c.y + Math.sin(p.a) * p.r; die('burn'); }
        if (p.r < c.core + 22 && Math.floor(t * 8) !== Math.floor((t - dt) * 8)) sndTick();
      }
      const w = ORBIT_V / p.r * p.d;
      p.a += w * dt; p.orbT += dt; p.lap += Math.abs(w) * dt;
      p.x = c.x + Math.cos(p.a) * p.r; p.y = c.y + Math.sin(p.a) * p.r;
    } else if (p.mode === 'fly') {
      const steps = 4, sdt = dt / steps;
      for (let s = 0; s < steps && p.mode === 'fly' && state !== 'dead'; s++) {
        p.x += p.vx * sdt; p.y += p.vy * sdt; p.fly += FLY_V * sdt;
        // hazards
        for (const h of hazards) {
          if (Math.hypot(p.x - h.x, p.y - h.y) < h.r) { die('void'); break; }
        }
        if (state === 'dead') break;
        for (const pl of planets) {
          const d = Math.hypot(p.x - pl.x, p.y - pl.y);
          if (pl === p.ignore) { if (d > pl.capR + 8) p.ignore = null; continue; }
          if (d < pl.core) { die('burn'); break; }
          if (d < pl.capR) { capture(pl, d); break; }
        }
      }
      if (p.mode === 'fly' && p.fly > MAX_FLY) die('lost');
      if (p.mode === 'fly') {
        trail.push({ x: p.x, y: p.y, l: 0.5 });
      }
    }
  }
  if (p.mode === 'orbit') trail.push({ x: p.x, y: p.y, l: 0.35 });
  for (const q of trail) q.l -= dt;
  while (trail.length && trail[0].l <= 0) trail.shift();

  // world upkeep
  while (planets[planets.length - 1].idx < player.cur.idx + 7) spawnNext();
  while (planets.length > 14 && planets[0] !== p.cur && planets[0] !== p.ignore) planets.shift();
  for (let i = hazards.length - 1; i >= 0; i--) {
    if (Math.hypot(hazards[i].x - p.x, hazards[i].y - p.y) > 1400) hazards.splice(i, 1);
  }

  // particles / popups
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i]; q.life -= dt;
    if (q.life <= 0) { particles.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.97; q.vy *= 0.97;
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const q = popups[i]; q.life -= dt * 0.9; q.y -= 40 * dt;
    if (q.life <= 0) popups.splice(i, 1);
  }
  shake = Math.max(0, shake - dt * 30);

  // camera
  let tx, ty;
  if (p.mode === 'orbit' || p.mode === 'dead') { tx = p.cur.x - fwd.x * 110; ty = p.cur.y - fwd.y * 110; if (p.mode === 'dead') { tx = p.x; ty = p.y; } }
  else { tx = p.x + p.vx * 0.12 - fwd.x * 60; ty = p.y + p.vy * 0.12 - fwd.y * 60; }
  const k = 1 - Math.pow(0.002, dt);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
}

function capture(pl, d) {
  const p = player;
  const relx = p.x - pl.x, rely = p.y - pl.y;
  const cross = relx * p.vy - rely * p.vx;
  p.d = cross >= 0 ? 1 : -1;
  p.a = Math.atan2(rely, relx);
  p.r = Math.max(d, pl.core + 26);
  p.cur = pl; p.mode = 'orbit'; p.ignore = null;
  const lapDone = p.lap; p.lap = 0; p.orbT = 0;
  const fresh = !pl.claimed && pl.idx > 0;
  if (fresh) {
    pl.claimed = true;
    const fast = lapDone < TAU * 1.0;
    streak = fast ? streak + 1 : 0;
    const bonus = Math.min(streak, 6);
    const pts = 1 + bonus;
    score += pts;
    sndCapture(streak);
    popup(pl.x, pl.y - pl.capR - 10, '+' + pts + (streak > 1 ? '  ×' + streak : ''), pl.hue);
    burst(pl.x, pl.y, 24 + streak * 3, pl.hue, 220, 0.9);
    shake = 4 + Math.min(streak, 6);
  } else {
    sndCapture(0);
    burst(p.x, p.y, 10, pl.hue, 100, 0.5);
  }
}

// ---------- draw ----------
function draw() {
  const sx = (x) => (x - cam.x) * S + W / 2, sy = (y) => (y - cam.y) * S + H / 2;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0818'); bg.addColorStop(1, '#170a1c');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // stars parallax
  for (const s of stars) {
    let x = ((s.x * W - cam.x * S * s.z) % W + W) % W;
    let y = ((s.y * H - cam.y * S * s.z) % H + H) % H;
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 1.5 + s.p);
    ctx.fillStyle = '#cfc8ff';
    ctx.fillRect(x, y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  let ox = 0, oy = 0;
  if (shake > 0) { ox = rnd(-shake, shake); oy = rnd(-shake, shake); }
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * (W / 2 - cam.x * S + ox), DPR * (H / 2 - cam.y * S + oy));

  // hazards
  for (const h of hazards) {
    const pr = 1 + Math.sin(t * 3 + h.ph) * 0.08;
    const g = ctx.createRadialGradient(h.x, h.y, h.r * 0.3, h.x, h.y, h.r * 2.2);
    g.addColorStop(0, 'rgba(255,40,70,0.35)'); g.addColorStop(1, 'rgba(255,40,70,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(h.x, h.y, h.r * 2.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(h.x, h.y, h.r * pr, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ff3355'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r * pr, 0, TAU); ctx.stroke();
    ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(t * 1.2 + h.ph);
    ctx.strokeStyle = 'rgba(255,90,110,0.6)'; ctx.setLineDash([6, 8]);
    ctx.beginPath(); ctx.arc(0, 0, h.r * 1.35, 0, TAU); ctx.stroke(); ctx.restore();
    ctx.setLineDash([]);
  }

  // planets
  for (const pl of planets) {
    const isCur = pl === player.cur && player.mode === 'orbit';
    const hue = pl.hue;
    const danger = isCur && state === 'play' ? Math.max(0, 1 - (player.r - pl.core) / 40) : 0;
    // capture ring
    ctx.save(); ctx.translate(pl.x, pl.y); ctx.rotate(t * 0.15 + pl.pulse);
    ctx.strokeStyle = `hsla(${hue},80%,70%,${isCur ? 0.35 : 0.22})`;
    ctx.lineWidth = 1.5; ctx.setLineDash([4, 9]);
    ctx.beginPath(); ctx.arc(0, 0, pl.capR, 0, TAU); ctx.stroke(); ctx.restore(); ctx.setLineDash([]);
    if (isCur) {
      ctx.strokeStyle = `hsla(${hue},90%,75%,0.18)`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(pl.x, pl.y, player.r, 0, TAU); ctx.stroke();
    }
    // glow
    const gr = pl.core * 3.2 * (1 + Math.sin(t * 2 + pl.pulse) * 0.06);
    const g = ctx.createRadialGradient(pl.x, pl.y, pl.core * 0.4, pl.x, pl.y, gr);
    g.addColorStop(0, `hsla(${hue},95%,${65 + danger * 10}%,0.7)`); g.addColorStop(1, `hsla(${hue},95%,55%,0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(pl.x, pl.y, gr, 0, TAU); ctx.fill();
    ctx.fillStyle = danger > 0 ? `hsl(${hue - danger * 30},100%,${72 - danger * 12}%)` : `hsl(${hue},90%,72%)`;
    ctx.beginPath(); ctx.arc(pl.x, pl.y, pl.core, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(pl.x - pl.core * 0.25, pl.y - pl.core * 0.25, pl.core * 0.4, 0, TAU); ctx.fill();
  }

  const p = player;
  // aim guide
  if (p.mode === 'orbit' && state !== 'dead') {
    const tx = -Math.sin(p.a) * p.d, ty = Math.cos(p.a) * p.d;
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 2; ctx.setLineDash([3, 10]);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + tx * 340, p.y + ty * 340); ctx.stroke();
    ctx.setLineDash([]);
  }

  // trail
  for (const q of trail) {
    const a = Math.max(0, q.l) / 0.5;
    ctx.fillStyle = `rgba(255,190,110,${a * 0.6})`;
    ctx.beginPath(); ctx.arc(q.x, q.y, 2 + a * 4, 0, TAU); ctx.fill();
  }

  // particles
  ctx.globalCompositeOperation = 'lighter';
  for (const q of particles) {
    const a = q.life / q.max;
    ctx.fillStyle = `hsla(${q.hue},100%,60%,${a})`;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (0.4 + a), 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // player
  if (p.mode !== 'dead') {
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 22);
    g.addColorStop(0, 'rgba(255,220,150,0.85)'); g.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 22, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff6e0'; ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, TAU); ctx.fill();
  }

  // popups
  ctx.textAlign = 'center';
  for (const q of popups) {
    ctx.globalAlpha = Math.min(1, q.life * 1.5);
    ctx.fillStyle = `hsl(${q.hue},100%,78%)`;
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.fillText(q.text, q.x, q.y);
  }
  ctx.globalAlpha = 1;

  // ---------- HUD ----------
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.textAlign = 'center';
  const u = Math.min(W, H) / 640;
  ctx.fillStyle = '#fff';
  ctx.font = `800 ${Math.round(64 * Math.max(u, 0.7))}px system-ui, sans-serif`;
  ctx.globalAlpha = state === 'dead' ? 0.35 : 0.9;
  ctx.fillText(score, W / 2, 30 + 64 * Math.max(u, 0.7));
  ctx.globalAlpha = 1;
  ctx.font = `600 ${Math.round(15 * Math.max(u, 0.8))}px system-ui, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('BEST ' + best, W / 2, 30 + 64 * Math.max(u, 0.7) + 24 * Math.max(u, 0.8));
  if (streak > 1 && state === 'play') {
    ctx.fillStyle = '#ffd08a';
    ctx.font = `700 ${Math.round(18 * Math.max(u, 0.8))}px system-ui, sans-serif`;
    ctx.fillText('STREAK ×' + streak, W / 2, 30 + 64 * Math.max(u, 0.7) + 50 * Math.max(u, 0.8));
  }

  const big = Math.round(34 * Math.max(u, 0.75)), small = Math.round(16 * Math.max(u, 0.85));
  if (state === 'ready') {
    const a = 0.6 + 0.4 * Math.sin(t * 4);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.font = `800 ${big}px system-ui, sans-serif`;
    ctx.fillText('TAP TO LAUNCH', W / 2, H * 0.82);
    ctx.font = `500 ${small}px system-ui, sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('Release along the dotted line. Catch the next star.', W / 2, H * 0.82 + small * 2);
    ctx.fillText('Orbits shrink — don’t linger. Avoid black holes.', W / 2, H * 0.82 + small * 3.5);
  }
  if (state === 'dead') {
    ctx.fillStyle = 'rgba(5,3,12,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff8a6a';
    ctx.font = `800 ${Math.round(big * 1.3)}px system-ui, sans-serif`;
    const msg = player.why === 'burn' ? 'BURNED UP' : player.why === 'void' ? 'SWALLOWED' : 'ADRIFT';
    ctx.fillText(msg, W / 2, H * 0.4);
    ctx.fillStyle = '#fff';
    ctx.font = `800 ${Math.round(big * 1.6)}px system-ui, sans-serif`;
    ctx.fillText(score, W / 2, H * 0.4 + big * 2);
    ctx.font = `600 ${small}px system-ui, sans-serif`;
    ctx.fillStyle = newBest ? '#ffd08a' : 'rgba(255,255,255,0.6)';
    ctx.fillText(newBest ? 'NEW BEST!' : 'BEST ' + best, W / 2, H * 0.4 + big * 3.1);
    if (deadT > 0.55) {
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 5 + deadT * 5);
      ctx.fillStyle = '#fff'; ctx.font = `800 ${Math.round(big * 0.8)}px system-ui, sans-serif`;
      ctx.fillText('TAP TO RETRY', W / 2, H * 0.4 + big * 5);
      ctx.globalAlpha = 1;
    }
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 20); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
