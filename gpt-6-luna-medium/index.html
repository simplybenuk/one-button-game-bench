<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d1a">
<title>Lumen Drift</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d1a;color:#e9f5ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.frame{position:relative;width:min(100vw,calc(100vh * 1.55));height:min(100vh,calc(100vw / 1.55));min-height:300px;background:#080d1a;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%}.top{position:absolute;inset:24px 30px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand{font-size:12px;font-weight:800;letter-spacing:.2em;color:#a9c3db}.brand span{display:block;margin-top:5px;font:10px ui-monospace,monospace;letter-spacing:.16em;color:#57718c}.stats{display:flex;gap:30px;text-align:right}.stat label{display:block;color:#64829f;font:9px ui-monospace,monospace;letter-spacing:.16em}.stat strong{display:block;margin-top:4px;font:19px ui-monospace,monospace;color:#e7f7ff}.bottom{position:absolute;inset:auto 30px 22px;display:flex;justify-content:space-between;align-items:end;color:#61809a;font:9px ui-monospace,monospace;letter-spacing:.12em;pointer-events:none}.meter{display:flex;gap:5px;align-items:center}.meter i{display:block;width:7px;height:7px;border:1px solid #456076;border-radius:50%}.meter i.on{background:#63f5d2;border-color:#63f5d2;box-shadow:0 0 9px #63f5d2}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,84%);text-align:center;pointer-events:none}.eyebrow{font:10px ui-monospace,monospace;letter-spacing:.28em;color:#68f2d0}.title{margin:10px 0 6px;font-size:clamp(36px,7vw,72px);font-weight:800;letter-spacing:-.07em;line-height:1}.copy{margin:13px auto 0;max-width:420px;color:#9bb2c8;font-size:14px;line-height:1.7}.prompt{display:inline-flex;align-items:center;gap:10px;margin-top:28px;padding:11px 16px;border:1px solid #345166;border-radius:5px;background:#112033aa;color:#dffbf5;font:10px ui-monospace,monospace;letter-spacing:.14em}.key{display:grid;place-items:center;width:23px;height:23px;border:1px solid #57758a;border-radius:4px;color:#baf9ec;font-size:11px}.hide{display:none}.toast{position:absolute;top:24%;left:50%;transform:translate(-50%,-10px);opacity:0;color:#b5ffef;font:10px ui-monospace,monospace;letter-spacing:.18em;transition:.3s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){.top{inset:16px 18px auto}.bottom{inset:auto 18px 14px}.stats{gap:16px}.stat strong{font-size:16px}.brand{font-size:10px}.center{width:88%}.copy{font-size:12px}}
</style>
</head>
<body><main class="frame" id="frame"><canvas id="game" aria-label="Lumen Drift one-button game"></canvas><div class="top"><div class="brand">LUMEN DRIFT<span>STARSHIP 09 · FLIGHT RECORDER</span></div><div class="stats"><div class="stat"><label>DISTANCE</label><strong id="distance">0000</strong></div><div class="stat"><label>SPARKS</label><strong id="sparks">00</strong></div></div></div><div class="bottom"><div id="status">SYSTEM IDLE</div><div class="meter" id="meter"></div></div><div class="center" id="overlay"><div class="eyebrow">A QUIET LITTLE FLIGHT</div><div class="title">Lumen<br>Drift</div><div class="copy">The ship carries you forward. Flip your pull to glide between the shifting gates. Catch the loose sparks along the way.</div><div class="prompt"><span class="key">␣</span> PRESS TO BEGIN</div></div><div class="toast" id="toast">POLARITY REVERSED</div></main>
<script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),frame=document.querySelector('#frame'),overlay=document.querySelector('#overlay'),distanceEl=document.querySelector('#distance'),sparksEl=document.querySelector('#sparks'),statusEl=document.querySelector('#status'),meter=document.querySelector('#meter'),toast=document.querySelector('#toast');let W=0,H=0,dpr=1,state='ready',last=0,t=0,dist=0,score=0,run=0,shake=0,particles=[],gates=[],stars=[],player={y:0,vy:0,gravity:1,trail:[]},toastTimeout;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function resize(){const r=frame.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(state==='ready')player.y=H*.5;stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,z:rand(.2,1),a:rand(.15,.7)}))}addEventListener('resize',resize);resize();
function reset(){t=0;dist=0;score=0;run=0;shake=0;particles=[];gates=[];player={y:H*.5,vy:0,gravity:1,trail:[]};for(let i=0;i<3;i++)addGate(W*.72+i*W*.48);distanceEl.textContent='0000';sparksEl.textContent='00';meter.innerHTML='';statusEl.textContent='IN FLIGHT';overlay.classList.add('hide');state='play'}function addGate(x){const gap=clamp(H*.43-run*.0008,H*.27,H*.43),cy=rand(H*.38,H*.62);gates.push({x,cy,gap,w:24,passed:false,spark:true,phase:rand(0,6.28)})}
function input(e){if(e)e.preventDefault();if(state==='ready'){reset();return}if(state==='dead'){reset();return}if(state!=='play')return;player.gravity*=-1;player.vy+=player.gravity*-140;for(let i=0;i<8;i++)particles.push({x:W*.27,y:player.y,vx:rand(-110,20),vy:rand(-100,100),life:rand(.25,.6),color:'#68f2d0'});toast.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>toast.classList.remove('show'),360)}frame.addEventListener('pointerdown',input);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)input(e)}});
function die(){state='dead';shake=13;statusEl.textContent='SIGNAL LOST';overlay.innerHTML='<div class="eyebrow">FLIGHT RECORDER · '+String(Math.floor(dist)).padStart(4,'0')+'M</div><div class="title">Drift<br>ended</div><div class="copy">'+score+' sparks recovered. The ship is ready when you are.</div><div class="prompt"><span class="key">␣</span> PRESS TO FLY AGAIN</div>';overlay.classList.remove('hide');for(let i=0;i<26;i++)particles.push({x:W*.27,y:player.y,vx:rand(-180,180),vy:rand(-180,180),life:rand(.3,.9),color:i%3?'#68f2d0':'#f7ce85'})}
function update(dt){t+=dt;if(state==='play'){run+=dt;dist+=dt*(21+Math.min(13,run*.22));player.vy+=player.gravity*360*dt;player.vy=clamp(player.vy,-250,250);player.y+=player.vy*dt;player.trail.push({y:player.y,a:1});if(player.trail.length>11)player.trail.shift();for(const g of gates){g.x-= (185+Math.min(105,run*2.7))*dt;g.phase+=dt*2;if(!g.passed&&g.x+g.w<W*.27){g.passed=true;score++;sparksEl.textContent=String(score).padStart(2,'0');for(let i=0;i<15;i++)particles.push({x:g.x,y:g.cy,vx:rand(-70,70),vy:rand(-130,130),life:rand(.35,.8),color:'#f7ce85'})}if(Math.abs(g.x-W*.27)<g.w/2+12){const gap=g.gap+Math.sin(g.phase)*5;if(Math.abs(player.y-g.cy)>gap/2-13)die()}}gates=gates.filter(g=>g.x>-50);while(gates.length<4)addGate((gates.at(-1)?.x||W)+W*.48);if(player.y<14||player.y>H-14)die();distanceEl.textContent=String(Math.floor(dist)).padStart(4,'0');}
for(const s of stars){s.x-=s.z*(state==='play'?32:8)*dt;if(s.x<0){s.x=W;s.y=Math.random()*H}}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=35*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}
function draw(){ctx.clearRect(0,0,W,H);let sx=shake?rand(-shake,shake):0;shake=Math.max(0,shake-35/60);ctx.save();ctx.translate(sx,0);let bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#091120');bg.addColorStop(.6,'#0b1625');bg.addColorStop(1,'#101828');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
// distant starfield and subtle orbital lines
for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#a8d9ed';ctx.fillRect(s.x,s.y,s.z*1.7,s.z*1.7)}ctx.globalAlpha=1;ctx.strokeStyle='#284055';ctx.globalAlpha=.18;for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(W*.72,H*.5,W*(.2+i*.12),H*(.12+i*.1),-.18,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;
// flight corridor
ctx.fillStyle='#0d1d2a';ctx.fillRect(0,H*.09,W,H*.045);ctx.fillRect(0,H*.865,W,H*.045);ctx.strokeStyle='#385e6a';ctx.globalAlpha=.55;ctx.setLineDash([4,11]);ctx.beginPath();ctx.moveTo(0,H*.09);ctx.lineTo(W,H*.09);ctx.moveTo(0,H*.91);ctx.lineTo(W,H*.91);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
for(const g of gates){const gap=g.gap+Math.sin(g.phase)*5,top=g.cy-gap/2,bot=g.cy+gap/2;let pulse=.7+Math.sin(g.phase*2)*.15;ctx.shadowBlur=18;ctx.shadowColor='#56eacb';ctx.fillStyle='#173d46';ctx.fillRect(g.x-g.w/2,H*.09,g.w,top-H*.09);ctx.fillRect(g.x-g.w/2,bot,g.w,H*.91-bot);ctx.fillStyle='#62f0d1';ctx.globalAlpha=pulse;ctx.fillRect(g.x-g.w/2-2,top-2,g.w+4,5);ctx.fillRect(g.x-g.w/2-2,bot-3,g.w+4,5);ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.fillStyle='#9bffe9';ctx.fillRect(g.x-g.w/2+6,H*.11,2,Math.max(0,top-H*.13));ctx.fillRect(g.x-g.w/2+6,bot+6,2,Math.max(0,H*.89-bot-10));if(!g.passed){ctx.beginPath();ctx.arc(g.x,g.cy,3,0,Math.PI*2);ctx.fillStyle='#f7ce85';ctx.shadowBlur=12;ctx.shadowColor='#f7ce85';ctx.fill();ctx.shadowBlur=0}}
// ship glow and comet trail
const px=W*.27;player.trail.forEach((v,i)=>{const a=i/player.trail.length*.2;ctx.globalAlpha=a;ctx.fillStyle='#60efd1';ctx.beginPath();ctx.arc(px-(player.trail.length-i)*5,v.y,3+i/player.trail.length*4,0,7);ctx.fill()});ctx.globalAlpha=1;ctx.save();ctx.translate(px,player.y);ctx.rotate(clamp(player.vy/440,-.45,.45));ctx.shadowBlur=26;ctx.shadowColor='#71f8dc';ctx.fillStyle='#c6fff3';ctx.beginPath();ctx.moveTo(14,0);ctx.quadraticCurveTo(3,9,-11,7);ctx.lineTo(-5,0);ctx.lineTo(-11,-7);ctx.quadraticCurveTo(3,-9,14,0);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff4cf';ctx.beginPath();ctx.arc(0,0,2.5,0,7);ctx.fill();ctx.restore();
for(const p of particles){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.3,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.restore();requestAnimationFrame(loop)}let prev=0;function loop(ms){const dt=Math.min(.035,(ms-prev)/1000||0);prev=ms;update(dt);draw()}requestAnimationFrame(loop);})();
</script></body></html>
