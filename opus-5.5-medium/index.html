<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06060d">
<title>Kindle</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #06060d; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" aria-label="Kindle: tap, click or press Space to leap"></canvas>
<script>
(() => {
'use strict';

// ---------- Setup ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const COL = 400;              // playable column width in world units
let cw = 0, ch = 0, dpr = 1, scale = 1, offX = 0, viewW = COL, viewH = 700;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = window.innerWidth; ch = window.innerHeight;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  scale = Math.min(cw / COL, ch / 640);
  viewW = cw / scale; viewH = ch / scale;
  offX = (cw - COL * scale) / 2;
  buildVignette();
}

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

// Pre-rendered glow sprite
function makeGlow(r, g, b) {
  const s = 128, c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');
  const gr = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, `rgba(${r},${g},${b},1)`);
  gr.addColorStop(0.18, `rgba(${r},${g},${b},0.55)`);
  gr.addColorStop(0.45, `rgba(${r},${g},${b},0.16)`);
  gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, s, s);
  return c;
}
const GLOW_WARM = makeGlow(255, 170, 70);
const GLOW_GOLD = makeGlow(255, 225, 120);
const GLOW_COLD = makeGlow(110, 140, 220);
const GLOW_WHITE = makeGlow(255, 240, 210);
const GLOW_VIOLET = makeGlow(170, 70, 255);

let vignette = null;
function buildVignette() {
  vignette = document.createElement('canvas');
  vignette.width = 256; vignette.height = 256;
  const x = vignette.getContext('2d');
  const g = x.createRadialGradient(128, 128, 20, 128, 128, 128);
  g.addColorStop(0, 'rgba(3,2,8,0)');
  g.addColorStop(0.55, 'rgba(3,2,8,0.25)');
  g.addColorStop(1, 'rgba(3,2,8,0.92)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
}

// ---------- Audio ----------
let actx = null, master = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
  } catch (e) { actx = null; }
}
function tone(freq, dur, type = 'sine', vol = 0.3, slideTo = 0, delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol, fFrom, fTo, q = 1) {
  if (!actx) return;
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = actx.currentTime;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(fFrom, t); f.frequency.exponentialRampToValueAtTime(fTo, t + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
const PENTA = [0, 2, 4, 7, 9];
const noteFreq = (k) => 330 * Math.pow(2, (PENTA[k % 5] + 12 * Math.floor(k / 5)) / 12);
const sfx = {
  leap() { noise(0.18, 0.25, 900, 3000, 0.8); tone(220, 0.12, 'triangle', 0.08, 440); },
  catch(q, k) {
    const f = noteFreq(Math.min(k, 14));
    tone(f, 0.5, 'sine', 0.28); tone(f * 2, 0.35, 'triangle', 0.06);
    if (q === 2) { tone(f * 1.5, 0.6, 'sine', 0.14, 0, 0.06); tone(f * 3, 0.4, 'sine', 0.05, 0, 0.1); }
  },
  mote(k) { tone(1200 + k * 60, 0.12, 'sine', 0.1, 1800 + k * 60); },
  gold() { [0, 4, 7, 12].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.4, 'triangle', 0.12, 0, i * 0.05)); },
  tick() { tone(880, 0.05, 'square', 0.04); },
  gutter() { noise(0.4, 0.3, 600, 150, 1.5); tone(200, 0.35, 'sawtooth', 0.06, 90); },
  die() { noise(0.7, 0.45, 400, 60, 0.7); tone(160, 0.8, 'sine', 0.3, 40); },
  start() { tone(392, 0.3, 'sine', 0.15); tone(587, 0.4, 'sine', 0.12, 0, 0.08); }
};
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// ---------- State ----------
let best = 0;
try { best = +localStorage.getItem('kindle-best') || 0; } catch (e) {}

let state, player, lanterns, wisps, motes, particles, popups, stars;
let score, combo, lit, camY, shake, deadT, deathReason, genCount, lastGen, time, flash, hitStop, newBest, started, tickAcc;

function makeStars() {
  stars = [];
  for (let i = 0; i < 140; i++) {
    stars.push({ x: Math.random(), y: Math.random(), d: rand(0.05, 0.4), s: rand(0.4, 1.6), tw: rand(0, 6.28) });
  }
}

function difficulty() { return Math.min(1, genCount / 70); }

function makeLantern(x, y, opts = {}) {
  const d = difficulty();
  return {
    x, y, baseX: x, r: opts.gold ? 10 : 13,
    cap: opts.gold ? 50 : 62,
    fuseMax: opts.fuse || (lerp(4.6, 2.1, d) * (opts.gold ? 0.7 : 1)),
    fuse: 0, lit: false, out: false, gold: !!opts.gold,
    amp: 0, freq: 0, phase: rand(0, 6.28), pulse: 0, pd: -1, burnT: 0
  };
}

function spawnNext() {
  genCount++;
  const d = difficulty();
  const gap = rand(120, 165) + d * rand(15, 70);
  const px = lastGen.baseX;
  let x, tries = 0;
  do { x = rand(55, 345); tries++; } while ((Math.abs(x - px) < 35 || Math.abs(x - px) > 230) && tries < 20);
  const y = lastGen.y - gap;
  const L = makeLantern(x, y);
  // moving lanterns
  if (genCount > 7 && Math.random() < Math.min(0.55, (genCount - 7) * 0.035)) {
    L.amp = Math.min(rand(25, 45 + d * 45), x - 40, 360 - x);
    L.amp = Math.max(L.amp, 0);
    L.freq = rand(0.5, 0.9 + d * 0.6);
  }
  lanterns.push(L);

  // motes along the line between lanterns
  if (genCount > 2 && Math.random() < 0.55) {
    const n = 3;
    const ox = rand(-25, 25);
    for (let i = 1; i <= n; i++) {
      const t = i / (n + 1);
      motes.push({ x: lerp(px, x, t) + ox * Math.sin(t * Math.PI), y: lerp(lastGen.y, y, t), got: false, ph: rand(0, 6) });
    }
  }

  // bonus gold lantern, off to the side
  if (genCount > 4 && Math.random() < 0.2) {
    const side = x < 200 ? 1 : -1;
    const gx = clamp(x + side * rand(120, 190), 40, 360);
    const gy = y + rand(-50, 40);
    if (Math.abs(gx - x) > 90) lanterns.push(makeLantern(gx, gy, { gold: true }));
  }

  // wisps
  if (genCount > 12 && Math.random() < Math.min(0.6, 0.15 + (genCount - 12) * 0.02)) {
    const my = lerp(lastGen.y, y, rand(0.35, 0.65));
    wisps.push({
      x: 200, y: my, baseX: rand(120, 280), amp: rand(80, 150),
      freq: rand(0.35, 0.7 + d * 0.5), phase: rand(0, 6.28),
      r: rand(12, 16 + d * 6), seed: Math.random() * 100
    });
  }
  lastGen = L;
}

function reset() {
  lanterns = []; wisps = []; motes = []; particles = []; popups = [];
  score = 0; combo = 0; lit = 0; genCount = 0; shake = 0; deadT = 0; time = 0;
  flash = 0; hitStop = 0; newBest = false; started = false; tickAcc = 0;
  const first = makeLantern(200, 0, { fuse: 6 });
  first.lit = true; first.fuse = first.fuseMax;
  lanterns.push(first);
  lastGen = { baseX: 200, y: 0 };
  // gentle opener: straight up
  const second = makeLantern(200, -140);
  lanterns.push(second); lastGen = second; genCount = 1;
  camY = -viewH * 0.66;
  player = { x: 200, y: 50, mode: 'orbit', anchor: first, ang: Math.PI / 2 + 0.6, r: 46, dir: 1, vx: 0, vy: 0, flightT: 0, last: null, trail: [] };
  state = 'ready';
}

function speed() { return 250 + Math.min(lit * 3.2, 170); }

// ---------- Input ----------
function press() {
  initAudio();
  if (state === 'dead') {
    if (deadT > 0.7) { reset(); state = 'play'; started = true; sfx.start(); }
    return;
  }
  if (state === 'ready') { state = 'play'; started = true; sfx.start(); return; }
  if (state === 'play' && player.mode === 'orbit') launch();
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    if (!e.repeat) press();
  }
});
cv.addEventListener('pointerdown', (e) => { e.preventDefault(); press(); });
cv.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

function launch() {
  const p = player, v = speed();
  p.vx = -Math.sin(p.ang) * p.dir * v;
  p.vy = Math.cos(p.ang) * p.dir * v;
  p.mode = 'fly'; p.flightT = 0; p.last = p.anchor;
  p.anchor = null;
  for (const L of lanterns) L.pd = -1;
  sfx.leap();
  burst(p.x, p.y, 8, 255, 200, 120, 60, 0.35);
}

function capture(L, d) {
  const p = player;
  const rx = p.x - L.x, ry = p.y - L.y;
  const cross = rx * p.vy - ry * p.vx;
  p.dir = cross >= 0 ? 1 : -1;
  p.r = Math.max(d, 22);
  p.ang = Math.atan2(ry, rx);
  p.x = L.x + Math.cos(p.ang) * p.r; p.y = L.y + Math.sin(p.ang) * p.r;
  p.mode = 'orbit'; p.anchor = L;
  L.pulse = 1;

  const fresh = !L.lit;
  // quality: 2 perfect, 1 good, 0 loose
  const q = d < 30 ? 2 : d < 46 ? 1 : 0;
  if (fresh) {
    L.lit = true; L.fuse = L.fuseMax; lit++;
    if (q === 2) combo++; else if (q === 0) combo = 0;
    const mult = 1 + combo;
    const pts = (L.gold ? 50 : 10) * mult + (q === 2 ? 5 * mult : 0);
    score += pts;
    const label = q === 2 ? 'PERFECT' : q === 1 ? 'GOOD' : '';
    popup(L.x, L.y - 30, '+' + pts, L.gold ? '#ffe07a' : '#ffc27a', 1);
    if (label) popup(L.x, L.y - 50, label + (combo > 1 && q === 2 ? ' ×' + mult : ''), q === 2 ? '#fff4c8' : '#ffb870', 0.8);
    if (L.gold) sfx.gold();
    sfx.catch(q, lit + combo);
    burst(L.x, L.y, q === 2 ? 26 : 16, 255, L.gold ? 220 : 170, 80, q === 2 ? 170 : 110, 0.7);
    shake = Math.max(shake, q === 2 ? 5 : 3);
    if (q === 2) { hitStop = 0.05; flash = 0.25; }
    buzz(q === 2 ? 18 : 8);
  } else {
    // re-landing on a lit lantern: refresh a little fuse, no score
    L.fuse = Math.max(L.fuse, 1.0);
    sfx.catch(0, 0);
    burst(L.x, L.y, 8, 255, 170, 80, 60, 0.4);
  }
}

// ---------- Effects ----------
function burst(x, y, n, r, g, b, spd, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(0.2, 1) * spd;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.5, 1) * life, max: life, r, g, b, size: rand(1.2, 3) });
  }
}
function smoke(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({ x: x + rand(-6, 6), y, vx: rand(-15, 15), vy: rand(-50, -20), life: rand(0.8, 1.4), max: 1.4, r: 120, g: 110, b: 130, size: rand(3, 7), smoke: true });
  }
}
function popup(x, y, text, color, size) { popups.push({ x, y, text, color, size, t: 0 }); }

function die(reason) {
  if (state !== 'play') return;
  state = 'dead'; deadT = 0; deathReason = reason;
  player.mode = 'dead';
  burst(player.x, player.y, 40, 255, 190, 110, 200, 1.1);
  shake = 14;
  sfx.die(); buzz(60);
  if (score > best) { best = score; newBest = true; try { localStorage.setItem('kindle-best', best); } catch (e) {} }
}

// ---------- Update ----------
function update(dt) {
  time += dt;
  if (hitStop > 0) { hitStop -= dt; dt *= 0.15; }

  // world motion
  for (const L of lanterns) {
    if (L.amp) L.x = L.baseX + Math.sin(time * L.freq * 2 + L.phase) * L.amp;
    L.pulse = Math.max(0, L.pulse - dt * 2);
  }
  for (const w of wisps) w.x = w.baseX + Math.sin(time * w.freq * 2 + w.phase) * w.amp;

  const p = player;
  if (state === 'play' || state === 'ready') {
    const v = speed();
    if (p.mode === 'orbit') {
      const L = p.anchor;
      p.ang += p.dir * v / p.r * dt * (state === 'ready' ? 0.55 : 1);
      p.x = L.x + Math.cos(p.ang) * p.r;
      p.y = L.y + Math.sin(p.ang) * p.r;
      if (state === 'play') {
        L.fuse -= dt;
        if (L.fuse < 1.2) {
          tickAcc += dt * (L.fuse < 0.6 ? 2 : 1);
          if (tickAcc > 0.2) { tickAcc = 0; sfx.tick(); }
        }
        if (L.fuse <= 0) {
          L.out = true; L.fuse = 0;
          smoke(L.x, L.y, 14); sfx.gutter();
          popup(L.x, L.y - 30, 'guttered', '#9a8fb0', 0.8);
          launch();
          p.last = L;
        }
      }
    } else if (p.mode === 'fly') {
      p.flightT += dt;
      const steps = 3, sdt = dt / steps;
      for (let s = 0; s < steps && p.mode === 'fly'; s++) {
        p.x += p.vx * sdt; p.y += p.vy * sdt;
        for (const L of lanterns) {
          if (L.out || L === p.last) continue;
          const d = Math.hypot(p.x - L.x, p.y - L.y);
          if (d < L.cap) {
            if (L.pd >= 0 && d > L.pd) { capture(L, L.pd); break; }
            L.pd = d;
          } else L.pd = -1;
        }
      }
      if (p.mode === 'fly') {
        if (p.x < -30 || p.x > COL + 30) die('Drifted off into the void');
        else if (p.flightT > 1.9) die('Lost in the dark');
      }
    }

    // trail
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 18) p.trail.shift();

    // motes
    for (const m of motes) {
      if (!m.got && Math.hypot(p.x - m.x, p.y - m.y) < 16) {
        m.got = true;
        const pts = 5 * (1 + combo);
        score += pts;
        sfx.mote(combo);
        burst(m.x, m.y, 6, 255, 230, 150, 60, 0.4);
        popup(m.x, m.y - 12, '+' + pts, '#fff0b0', 0.6);
      }
    }
    // wisps
    if (state === 'play') {
      for (const w of wisps) {
        if (Math.hypot(p.x - w.x, p.y - w.y) < w.r + 4) { die('Snuffed by a shade'); break; }
      }
    }

    // camera (only climbs)
    const target = p.y - viewH * 0.62;
    if (target < camY) camY += (target - camY) * Math.min(1, dt * 3.2);
    if (state === 'play' && p.y > camY + viewH + 20) die('Fell into the dark');

    // generation & cleanup
    while (lastGen.y > camY - viewH * 0.6) spawnNext();
    const cut = camY + viewH + 150;
    lanterns = lanterns.filter(L => L.y < cut || L === p.anchor);
    wisps = wisps.filter(w => w.y < cut);
    motes = motes.filter(m => m.y < cut && !m.got);
  } else if (state === 'dead') {
    deadT += dt;
    if (p.trail.length) p.trail.shift();
  }

  for (const q of particles) {
    q.x += q.vx * dt; q.y += q.vy * dt;
    const drag = q.smoke ? 0.98 : 0.94;
    q.vx *= Math.pow(drag, dt * 60); q.vy *= Math.pow(drag, dt * 60);
    q.life -= dt;
  }
  particles = particles.filter(q => q.life > 0);
  for (const u of popups) u.t += dt;
  popups = popups.filter(u => u.t < 1);
  shake = Math.max(0, shake - dt * 30);
  flash = Math.max(0, flash - dt);
}

// ---------- Render ----------
const SX = (x) => offX + x * scale;
const SY = (y) => (y - camY) * scale;

function drawGlow(img, x, y, size, alpha) {
  if (alpha <= 0) return;
  ctx.globalAlpha = alpha;
  const s = size * scale;
  ctx.drawImage(img, SX(x) - s / 2, SY(y) - s / 2, s, s);
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;

  // background
  const bg = ctx.createLinearGradient(0, 0, 0, ch);
  const h = clamp(-camY / 20000, 0, 1);
  bg.addColorStop(0, `rgb(${10 + h * 14 | 0},${8 + h * 4 | 0},${24 + h * 20 | 0})`);
  bg.addColorStop(1, '#06050b');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, cw, ch);

  ctx.save();
  ctx.translate(sx, sy);

  // stars (parallax)
  for (const s of stars) {
    const yy = ((s.y * viewH - camY * s.d) % viewH + viewH) % viewH;
    const a = 0.25 + 0.35 * Math.sin(time * 1.5 + s.tw) * 0.5 + 0.2;
    ctx.globalAlpha = a * (0.4 + s.d * 1.5);
    ctx.fillStyle = '#c8c4ff';
    ctx.fillRect(s.x * cw, yy * scale, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // column edges
  if (offX > 4) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(-20, -20, offX + 20, ch + 40);
    ctx.fillRect(offX + COL * scale, -20, offX + 20, ch + 40);
    ctx.strokeStyle = 'rgba(160,140,255,0.08)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(offX, 0); ctx.lineTo(offX, ch); ctx.moveTo(offX + COL * scale, 0); ctx.lineTo(offX + COL * scale, ch); ctx.stroke();
  }

  const p = player;
  ctx.globalCompositeOperation = 'lighter';

  // motes
  for (const m of motes) {
    const tw = 0.7 + 0.3 * Math.sin(time * 5 + m.ph);
    drawGlow(GLOW_GOLD, m.x, m.y, 26 * tw, 0.8);
  }

  // lanterns: glow
  for (const L of lanterns) {
    if (SY(L.y) < -120 || SY(L.y) > ch + 120) continue;
    if (L.out) { drawGlow(GLOW_COLD, L.x, L.y, 30, 0.12); continue; }
    const active = L === p.anchor;
    if (L.lit) {
      const f = active ? clamp(L.fuse / L.fuseMax, 0, 1) : 0.35;
      const flick = 0.92 + 0.08 * Math.sin(time * 17 + L.phase) + 0.05 * Math.sin(time * 31);
      drawGlow(L.gold ? GLOW_GOLD : GLOW_WARM, L.x, L.y, (130 + 90 * f + L.pulse * 80) * flick, active ? 0.9 : 0.4);
    } else {
      const breathe = 0.8 + 0.2 * Math.sin(time * 2 + L.phase);
      drawGlow(L.gold ? GLOW_GOLD : GLOW_COLD, L.x, L.y, 70 * breathe, L.gold ? 0.55 : 0.45);
    }
  }

  // wisps glow
  for (const w of wisps) {
    const wob = 1 + 0.15 * Math.sin(time * 6 + w.seed);
    drawGlow(GLOW_VIOLET, w.x, w.y, w.r * 5 * wob, 0.55);
  }

  // particles
  for (const q of particles) {
    if (q.smoke) continue;
    const a = clamp(q.life / q.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = `rgb(${q.r},${q.g},${q.b})`;
    const s = q.size * scale * (0.5 + a);
    ctx.fillRect(SX(q.x) - s / 2, SY(q.y) - s / 2, s, s);
  }

  // player trail + glow
  if (p.mode !== 'dead') {
    for (let i = 0; i < p.trail.length; i++) {
      const t = p.trail[i], a = i / p.trail.length;
      drawGlow(GLOW_WARM, t.x, t.y, 8 + a * 22, a * 0.35);
    }
    const flick = 1 + 0.08 * Math.sin(time * 23);
    drawGlow(GLOW_WHITE, p.x, p.y, 60 * flick, 0.95);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  // smoke
  for (const q of particles) {
    if (!q.smoke) continue;
    const a = clamp(q.life / q.max, 0, 1);
    ctx.globalAlpha = a * 0.35;
    ctx.fillStyle = '#6a6278';
    ctx.beginPath(); ctx.arc(SX(q.x), SY(q.y), q.size * scale * (2 - a), 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // lantern bodies + rings
  for (const L of lanterns) {
    const X = SX(L.x), Y = SY(L.y);
    if (Y < -120 || Y > ch + 120) continue;
    const active = L === p.anchor;
    // capture ring for unlit lanterns
    if (!L.lit && !L.out) {
      ctx.strokeStyle = L.gold ? 'rgba(255,220,120,0.22)' : 'rgba(150,170,255,0.16)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3 * scale, 6 * scale]);
      ctx.lineDashOffset = -time * 10;
      ctx.beginPath(); ctx.arc(X, Y, L.cap * scale, 0, 6.283); ctx.stroke();
      ctx.setLineDash([]);
      // perfect zone hint
      ctx.strokeStyle = L.gold ? 'rgba(255,220,120,0.10)' : 'rgba(150,170,255,0.08)';
      ctx.beginPath(); ctx.arc(X, Y, 30 * scale, 0, 6.283); ctx.stroke();
    }
    // body
    ctx.beginPath(); ctx.arc(X, Y, L.r * scale, 0, 6.283);
    if (L.out) ctx.fillStyle = '#26222f';
    else if (L.lit) ctx.fillStyle = L.gold ? '#fff2b0' : (active ? '#ffe2a8' : '#c98a4a');
    else ctx.fillStyle = L.gold ? '#b8943c' : '#3a4266';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = L.out ? '#3a3446' : L.lit ? 'rgba(255,240,200,0.8)' : (L.gold ? '#ffe07a' : '#7d8cc8');
    ctx.stroke();
    // inner flame
    if (L.lit && !L.out) {
      ctx.fillStyle = '#fffaf0';
      ctx.beginPath(); ctx.arc(X, Y, L.r * 0.4 * scale * (0.9 + 0.1 * Math.sin(time * 20 + L.phase)), 0, 6.283); ctx.fill();
    }
    // fuse arc
    if (active && state !== 'ready') {
      const f = clamp(L.fuse / L.fuseMax, 0, 1);
      const danger = L.fuse < 1.2;
      ctx.lineWidth = 3 * scale;
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.arc(X, Y, (L.r + 6) * scale, 0, 6.283); ctx.stroke();
      ctx.strokeStyle = danger ? (Math.sin(time * 30) > 0 ? '#ff5a3c' : '#ffb070') : '#ffd08a';
      ctx.beginPath(); ctx.arc(X, Y, (L.r + 6) * scale, -Math.PI / 2, -Math.PI / 2 + f * 6.283); ctx.stroke();
    }
  }

  // aim hint: tangent guide, fades out as you learn
  if ((state === 'ready' || state === 'play') && p.mode === 'orbit') {
    const guide = state === 'ready' ? 1 : clamp(1 - (lit - 2) / 6, 0, 1);
    if (guide > 0) {
      const tx = -Math.sin(p.ang) * p.dir, ty = Math.cos(p.ang) * p.dir;
      ctx.strokeStyle = `rgba(255,220,170,${0.35 * guide})`;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(SX(p.x), SY(p.y));
      const len = 170;
      ctx.lineTo(SX(p.x + tx * len), SY(p.y + ty * len));
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // wisps bodies
  for (const w of wisps) {
    const X = SX(w.x), Y = SY(w.y);
    if (Y < -80 || Y > ch + 80) continue;
    ctx.fillStyle = '#0b0614';
    ctx.beginPath();
    const n = 12;
    for (let i = 0; i <= n; i++) {
      const a = i / n * 6.283;
      const rr = w.r * (1 + 0.22 * Math.sin(a * 3 + time * 5 + w.seed) + 0.12 * Math.sin(a * 5 - time * 7));
      const px = X + Math.cos(a) * rr * scale, py = Y + Math.sin(a) * rr * scale;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.fill();
    ctx.strokeStyle = 'rgba(190,120,255,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
    // eyes
    ctx.fillStyle = '#e8c8ff';
    const look = clamp((p.x - w.x) / 200, -1, 1) * 2;
    ctx.fillRect(X + (-5 + look) * scale, Y - 2 * scale, 2.5 * scale, 2.5 * scale);
    ctx.fillRect(X + (3 + look) * scale, Y - 2 * scale, 2.5 * scale, 2.5 * scale);
  }

  // player core
  if (p.mode !== 'dead') {
    ctx.fillStyle = '#fffdf5';
    ctx.beginPath(); ctx.arc(SX(p.x), SY(p.y), 4.5 * scale, 0, 6.283); ctx.fill();
  }

  // darkness vignette, tightening as the fuse burns
  let dark = 0.55;
  if (p.anchor && state === 'play') dark = lerp(0.95, 0.45, clamp(p.anchor.fuse / p.anchor.fuseMax, 0, 1));
  else if (p.mode === 'fly') dark = 0.7 + Math.min(p.flightT / 1.9, 1) * 0.3;
  if (state === 'dead') dark = 1;
  const vr = Math.max(cw, ch) * lerp(1.6, 0.9, dark);
  ctx.globalAlpha = 0.5 + dark * 0.5;
  ctx.drawImage(vignette, SX(p.x) - vr, SY(p.y) - vr, vr * 2, vr * 2);
  ctx.fillStyle = 'rgba(3,2,8,0.92)';
  // cover beyond vignette
  const vx0 = SX(p.x) - vr, vy0 = SY(p.y) - vr;
  if (vx0 > -40) ctx.fillRect(-40, -40, vx0 + 41, ch + 80);
  if (vx0 + vr * 2 < cw + 40) ctx.fillRect(vx0 + vr * 2 - 1, -40, cw + 40, ch + 80);
  if (vy0 > -40) ctx.fillRect(-40, -40, cw + 80, vy0 + 41);
  if (vy0 + vr * 2 < ch + 40) ctx.fillRect(-40, vy0 + vr * 2 - 1, cw + 80, ch + 80);
  ctx.globalAlpha = 1;

  // popups
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const u of popups) {
    const a = 1 - u.t;
    ctx.globalAlpha = a;
    ctx.fillStyle = u.color;
    ctx.font = `600 ${Math.round(15 * u.size * scale * (1 + 0.3 * Math.max(0, 0.15 - u.t) / 0.15))}px system-ui, -apple-system, Segoe UI, sans-serif`;
    ctx.fillText(u.text, SX(u.x), SY(u.y - u.t * 30));
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = `rgba(255,230,180,${flash * 0.25})`; ctx.fillRect(0, 0, cw, ch); }

  drawHUD();
}

function font(px, w = 600) { return `${w} ${Math.round(px)}px system-ui, -apple-system, Segoe UI, sans-serif`; }

function drawHUD() {
  const u = Math.min(scale, 2.2);
  const cx = cw / 2;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const top = 18 * u;

  if (state === 'play' || state === 'dead') {
    ctx.fillStyle = 'rgba(255,236,200,0.95)';
    ctx.font = font(34 * u, 700);
    ctx.fillText(score, cx, top);
    ctx.font = font(12 * u, 500);
    ctx.fillStyle = 'rgba(200,190,230,0.7)';
    ctx.fillText(lit + ' lanterns lit', cx, top + 40 * u);
    if (combo > 0) {
      ctx.fillStyle = '#ffe9a8';
      ctx.font = font(15 * u, 700);
      ctx.fillText('×' + (1 + combo) + ' perfect chain', cx, top + 58 * u);
    }
  }
  if (best > 0 && state !== 'dead') {
    ctx.textAlign = 'right';
    ctx.font = font(11 * u, 500);
    ctx.fillStyle = 'rgba(200,190,230,0.55)';
    ctx.fillText('BEST ' + best, cw - 14 * u, 14 * u);
  }

  ctx.textAlign = 'center';
  if (state === 'ready') {
    const pulse = 0.6 + 0.4 * Math.sin(time * 3);
    ctx.textBaseline = 'middle';
    if (!started && lit === 0 && score === 0) {
      ctx.fillStyle = '#ffe2b0';
      ctx.font = font(52 * u, 800);
      ctx.fillText('KINDLE', cx, ch * 0.2);
      ctx.fillStyle = 'rgba(210,200,240,0.75)';
      ctx.font = font(13 * u, 500);
      ctx.fillText('light the lanterns · climb out of the dark', cx, ch * 0.2 + 40 * u);
    }
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#fff2d8';
    ctx.font = font(16 * u, 600);
    ctx.fillText('TAP  ·  CLICK  ·  SPACE  to begin', cx, ch * 0.88);
    ctx.globalAlpha = 1;
  } else if (state === 'play' && lit === 0 && player.mode === 'orbit') {
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 4);
    ctx.fillStyle = '#fff2d8';
    ctx.font = font(15 * u, 600);
    ctx.fillText('leap when the line points at a lantern', cx, ch * 0.88);
    ctx.globalAlpha = 1;
  }

  if (state === 'dead') {
    const a = clamp(deadT / 0.5, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(4,3,10,0.55)';
    ctx.fillRect(0, 0, cw, ch);
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#b8aede';
    ctx.font = font(16 * u, 500);
    ctx.fillText(deathReason, cx, ch * 0.36);
    ctx.fillStyle = '#ffe2b0';
    ctx.font = font(60 * u, 800);
    ctx.fillText(score, cx, ch * 0.45);
    ctx.font = font(14 * u, 600);
    ctx.fillStyle = newBest ? '#ffe07a' : 'rgba(210,200,240,0.7)';
    ctx.fillText(newBest ? '★ NEW BEST ★' : 'BEST ' + best, cx, ch * 0.45 + 48 * u);
    if (deadT > 0.7) {
      ctx.globalAlpha = a * (0.6 + 0.4 * Math.sin(time * 3));
      ctx.fillStyle = '#fff2d8';
      ctx.font = font(16 * u, 600);
      ctx.fillText('tap to rekindle', cx, ch * 0.66);
    }
    ctx.globalAlpha = 1;
  }
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
makeStars();
reset();
requestAnimationFrame(frame);

// test hook
window.__kindle = { get state() { return state; }, get player() { return player; }, get lanterns() { return lanterns; }, get score() { return score; }, press };
})();
</script>
</body>
</html>
